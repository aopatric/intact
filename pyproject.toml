[project]
name = "testbed"
version = "0.1.0"
description = "Pipeline library (rollouts, grades, per-token activations) on the Qwen3-4B reward-hacking adapters; requires a GPU"
authors = [
    { name = "Angel Patricio", email = "aopatric@mit.edu" }
]
requires-python = "==3.12.*"
dependencies = [
    "vllm==0.30.0",
    "transformers>=5.10.4",
    "peft>=0.21.0",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "pyseccomp",
]

[project.scripts]
testbed = "testbed.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "scikit-learn"]   # scikit-learn: examples/probe_smoke.py

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the RTX 4090; run with `-m gpu`"]
addopts = "-m 'not gpu'"
