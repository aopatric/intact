[project]
name = "testbed"
version = "0.1.0"
description = "Pipeline library (rollouts, grades, per-token activations) on the Qwen3-4B reward-hacking adapters; requires a GPU"
authors = [
    { name = "Angel Patricio", email = "aopatric@mit.edu" }
]
requires-python = "==3.12.*"
dependencies = [
    # Versions follow upstream's uv.lock at the pinned commit (DESIGN §3).
    "vllm==0.11.0",
    "torch==2.8.0",
    "transformers==4.57.1",
    "peft==0.17.1",
    "pydantic==2.12.3",   # upstream's grader (DESIGN §6 grade.py)
    "tqdm==4.67.1",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.scripts]
testbed = "testbed.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "scikit-learn"]   # scikit-learn: examples/probe_smoke.py

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the RTX 4090; run with `-m gpu`"]
addopts = "-m 'not gpu'"
